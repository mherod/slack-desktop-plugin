name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The bundled helper is Swift and the native tests compile it, so this must run on macOS.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check manifest versions agree
        run: bun scripts/check-manifests.mjs

      - name: Check the skill matches its last export
        run: bun scripts/check-export.mjs

      - name: Test
        run: bun run test
